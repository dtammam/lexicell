# scrutiny.toml — the review gate sizes itself from this table, not from the
# builder's judgment. Evaluated against `git diff --name-only` (+ change class).
# The builder may ESCALATE a row's seats; it may never de-escalate.
#
# seats: any of ["adversary", "qa", "security-brief"].
#   - adversary is the floor: every rule includes it, implicitly.
#   - security-brief is applied as a section by adversary+qa on every review;
#     naming it here spawns the DEDICATED security pass in addition.
# gate: "slim" = adversary only | "full" = all applicable seats.
#
# Rows are matched top to bottom; the FIRST matching non-floor rule sets the
# baseline, then every `force = true` rule that also matches is unioned in.
# A project may add rows in the [[project]] section with a `sunset` date.

[floor]
# Always, for every change. Never removed.
seats = ["adversary"]

# ---- Non-overridable rules (force: cannot be dialed down by anyone) ----

[[rule]]
name = "data-loss"
match = ["**/migrations/**", "**/*migration*", "**/schema*", "**/*.sql"]
change_class = ["deletes-data", "alters-schema"]
gate = "full"
seats = ["adversary", "qa", "security-brief"]
force = true

[[rule]]
name = "auth-and-secrets"
match = ["**/auth/**", "**/*secret*", "**/*credential*", "**/*token*", "**/.env*"]
gate = "full"
seats = ["adversary", "qa", "security-brief"]
force = true

[[rule]]
name = "network-boundary-and-deps"
match = ["**/package*.json", "**/Cargo.toml", "**/requirements*.txt", "**/go.mod", "**/*fetch*", "**/*client*"]
gate = "full"
seats = ["adversary", "qa", "security-brief"]
force = true

# ---- Baseline rules (set the default seat set by surface) ----

[[rule]]
name = "core-logic"
match = ["src/**", "lib/**", "app/**"]
gate = "full"
seats = ["adversary", "qa"]

[[rule]]
name = "docs-and-content"
match = ["docs/**", "**/*.md", "content/**"]
gate = "slim"
seats = ["adversary"]              # brief: claims-vs-tree, no tests to mutate

[[rule]]
name = "harness-and-config"
match = [".claude/**", ".harness/**", "*.toml", "*.json", "hooks/**"]
gate = "slim"
seats = ["adversary"]

# ---- Project rows: add below. Each MUST carry a sunset condition so a
#      temporary dial-down doesn't become permanent lore. Example:
#
# [[project]]
# name = "phase-0-iteration"
# match = ["src/ui/**"]
# gate = "slim"
# seats = ["adversary"]
# sunset = "when the game is live with real users"   # required

# The save schema stays on the full gate even under iteration mode below. Listed
# FIRST so it wins the match over the src/ui/** iteration-mode row. persist.ts owns
# the versioned localStorage save; a change there is a replay/data attack surface.
[[project]]
name = "save-schema-full"
match = ["src/ui/persist.ts"]
gate = "full"
seats = ["adversary", "qa"]
sunset = "never — persist.ts is a permanent attack surface, not a temporary dial-down"

# Iteration mode (Dean, 2026-09-08, re-confirmed on the harness adoption 2026-09-21):
# iterate fast on the non-risky surfaces. src/ui, src/content and scripts get the
# floor (Adversary only) instead of the full gate. src/engine/** is NOT listed here,
# so it keeps the full gate via the core-logic rule; the save schema keeps it above.
# The Architect may still ESCALATE any of these to full for a risky change.
[[project]]
name = "iteration-mode"
match = ["src/ui/**", "src/content/**", "scripts/**"]
gate = "slim"
seats = ["adversary"]
sunset = "when the game is live with real users, or when Dean says so"
