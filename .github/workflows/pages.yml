name: GitHub Pages

# The pack's "publish" step (ADR-006 Hosting B): the same static bundle, served publicly at
# https://dtammam.github.io/lexicell/ so anyone can play from a link. Built with the
# repo-name base path; the container build keeps base "/".
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys, and NEVER cancel one in progress. cancel-in-progress: true
# cancelled the running workflow mid-deploy, which orphaned its server-side Pages
# deployment "in progress" and then blocked every later deploy with a 400 ("please
# cancel <sha> first"). false queues deploys instead, so back-to-back merges each land.
# (GitHub's own Pages starter workflow uses false for this reason.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Build for the /lexicell/ base path
        env:
          BASE_PATH: /lexicell/
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
